<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Practice</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --accent: #8b5cf6;
      --accent-strong: #22d3ee;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --glass: rgba(15, 23, 42, 0.64);
      --border: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.38), transparent 28rem),
        radial-gradient(circle at 85% 15%, rgba(139, 92, 246, 0.42), transparent 26rem),
        radial-gradient(circle at 60% 90%, rgba(244, 114, 182, 0.26), transparent 24rem),
        linear-gradient(135deg, #020617 0%, #111827 48%, #1e1b4b 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 22rem;
      height: 22rem;
      border-radius: 999px;
      filter: blur(6px);
      opacity: 0.42;
      pointer-events: none;
    }

    body::before {
      top: -7rem;
      right: -4rem;
      background: conic-gradient(from 180deg, var(--accent), var(--accent-strong), transparent, var(--accent));
      animation: float 9s ease-in-out infinite;
    }

    body::after {
      left: -6rem;
      bottom: -7rem;
      background: conic-gradient(from 0deg, #f472b6, transparent, var(--accent-strong), #f472b6);
      animation: float 11s ease-in-out infinite reverse;
    }

    #app {
      position: relative;
      z-index: 1;
      width: min(92vw, 760px);
    }

    .hero {
      position: relative;
      padding: clamp(2rem, 7vw, 5rem);
      border: 1px solid var(--border);
      border-radius: 2rem;
      text-align: center;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.84), var(--glass));
      box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(24px);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 1rem;
      z-index: -1;
      border-radius: 1.35rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.4rem);
      line-height: 0.92;
      letter-spacing: -0.08em;
      background: linear-gradient(90deg, #fff 5%, #a5f3fc 36%, #c4b5fd 68%, #fbcfe8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 1.4rem 4rem rgba(34, 211, 238, 0.25);
    }

    p {
      max-width: 35rem;
      margin: 1.5rem auto 2.2rem;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
    }

    button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 11rem;
      border: 0;
      border-radius: 999px;
      padding: 1rem 2rem;
      overflow: hidden;
      color: #020617;
      background: linear-gradient(135deg, #67e8f9, #c4b5fd 52%, #f9a8d4);
      box-shadow: 0 1.25rem 2.5rem rgba(139, 92, 246, 0.32);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: translateX(-120%);
      transition: transform 500ms ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 1.7rem 3rem rgba(34, 211, 238, 0.28);
    }

    button:hover::after {
      transform: translateX(120%);
    }

    @keyframes float {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }

      50% {
        transform: translate3d(1.5rem, -1rem, 0) rotate(14deg);
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="js/renderHero.js" defer></script>
</body>
</html>
