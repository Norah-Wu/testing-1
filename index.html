<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Practice</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.28), transparent 24rem),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.24), transparent 24rem),
        linear-gradient(135deg, #020617 0%, #111827 100%);
    }

    #app {
      width: min(100%, 720px);
    }

    .hero {
      padding: clamp(2rem, 8vw, 4.5rem);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 1.5rem;
      text-align: center;
      background: rgba(15, 23, 42, 0.72);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
    }

    .hero-title {
      margin: 0;
      font-size: clamp(2.75rem, 9vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.06em;
      background: linear-gradient(90deg, #ffffff, #7dd3fc, #c4b5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-copy {
      max-width: 34rem;
      margin: 1.35rem auto 2rem;
      color: #cbd5e1;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
    }

    .hero-button {
      border: 0;
      border-radius: 999px;
      padding: 0.95rem 2rem;
      color: #020617;
      background: linear-gradient(135deg, #67e8f9, #c4b5fd);
      box-shadow: 0 1rem 2rem rgba(14, 165, 233, 0.24);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .hero-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 1.25rem 2.5rem rgba(14, 165, 233, 0.32);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="js/script.js" defer></script>
</body>
</html>
